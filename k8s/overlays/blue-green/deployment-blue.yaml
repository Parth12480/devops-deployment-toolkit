apiVersion: apps/v1
kind: Deployment
metadata:
  name: devops-demo-blue
spec:
  replicas: 2
  selector:
    matchLabels:
      app: devops-demo
      track: blue
  template:
    metadata:
      labels:
        app: devops-demo
        track: blue
    spec:
      containers:
        - name: devops-demo
          image: ghcr.io/YOUR_USERNAME/devops-deployment-toolkit:blue
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /ready
              port: 8080
